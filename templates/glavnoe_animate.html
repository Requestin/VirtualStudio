<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимация - Главное</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glavnoe_animate_styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
</head>
<body>
    <a href="{{ url_for('glavnoe') }}" class="button back-button">Назад</a>
    
    <div class="main-container">
        <h1 class="title">Создание анимации: "{{ video_name }}"</h1>
        
        <div class="preview-container">
            <!-- Левое окно - фото -->
            <div class="photo-preview-section">
                <h3>Исходное изображение</h3>
                <div class="photo-preview">
                    <img id="source-image" src="" alt="Исходное изображение">
                </div>
            </div>
            
            <!-- Правое окно - видео -->
            <div class="video-preview-section">
                <h3>Референсное видео</h3>
                <div class="video-preview">
                    <video id="driving-video" loop muted>
                        <source src="" type="video/mp4">
                        Ваш браузер не поддерживает видео.
                    </video>
                    <div id="video-placeholder" class="video-placeholder">
                        <p>Выберите референсное видео</p>
                    </div>
                </div>
                
                <div class="video-controls">
                    <input type="file" id="custom-video-input" accept=".mp4,.avi,.mov,.mkv" style="display: none;">
                    <button id="upload-custom-video-btn" class="control-btn">Загрузить свое видео</button>
                </div>
            </div>
        </div>
        
        <!-- Подборка готовых видео -->
        <div class="example-videos-section">
            <h3>Готовые референсные видео</h3>
            <div class="example-videos-grid" id="example-videos-grid">
                <!-- Видео будут загружены динамически -->
            </div>
        </div>
        
        <!-- Кнопка создания анимации -->
        <div class="action-section">
            <button id="create-animation-btn" class="action-btn" disabled>Создать анимацию</button>
        </div>
    </div>
    
    <!-- Overlay для загрузки -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Создание анимации...</div>
    </div>
    
    <!-- Модальное окно результата -->
    <div id="result-modal">
        <div class="modal-content">
            <div class="result-preview">
                <video id="result-video" controls loop>
                    <source src="" type="video/mp4">
                </video>
            </div>
            <div class="modal-actions">
                <button id="continue-btn" class="action-btn">Продолжить</button>
                <button id="delete-result-btn" class="action-btn delete-btn">Удалить</button>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification"></div>

    <script>
        // Передаем данные из Flask в JavaScript
        window.sourceImagePath = "{{ file_path }}";
        window.videoName = "{{ video_name }}";
    </script>
    <script src="{{ url_for('static', filename='scripts/glavnoe_animate_scripts.js') }}"></script>
</body>
</html>

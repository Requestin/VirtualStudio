<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVID плагин | {{ channel_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/channel_modules_styles.css') }}">
</head>
<body>
    <a href="{{ url_for('index') }}"><button class="back-button">← Назад к выбору телеканала</button></a>
    
    <div class="controls">
        <a href="{{ url_for('backremove') }}"><button class="action-btn add-person-btn">Добавить человека в БД</button></a>
        <a href="{{ url_for('delete_person_page') }}"><button class="action-btn delete-person-btn">Удалить из БД</button></a>
    </div>

    <div class="container">
        <h1 class="channel-title">{{ channel_name }}</h1>
        <h2 class="main-title">Выберите модуль для работы</h2>

        <div class="module-block">
            <h2 class="module-title">Тройные портреты</h2>
            <div class="button-row">
                <a href="{{ url_for('module_3win_v1', channel=channel) }}"><button class="module-button">Тройные портреты 1</button></a>
                <a href="{{ url_for('module_3win_v2', channel=channel) }}"><button class="module-button">Тройные портреты 2</button></a>
                <a href="{{ url_for('module_3win_v3', channel=channel) }}"><button class="module-button">Тройные портреты 3</button></a>
            </div>
        </div>
        
        <div class="module-block">
            <h2 class="module-title">Двойные портреты</h2>
            <div class="button-row">
                <a href="{{ url_for('module_2win_v1', channel=channel) }}"><button class="module-button">Двойные портреты 1</button></a>
                <a href="{{ url_for('module_2win_v2', channel=channel) }}"><button class="module-button">Двойные портреты 2</button></a>
                <a href="{{ url_for('module_2win_v3', channel=channel) }}"><button class="module-button">Двойные портреты 3</button></a>
            </div>
        </div>
        
        <div class="module-block">
            <h2 class="module-title">Одиночные портреты</h2>
            <div class="button-row">
                <a href="{{ url_for('module_1win_v1', channel=channel) }}"><button class="module-button">Одиночный портрет 1</button></a>
                <a href="{{ url_for('module_1win_v2', channel=channel) }}"><button class="module-button">Одиночный портрет 2</button></a>
                <a href="{{ url_for('module_1win_v3', channel=channel) }}"><button class="module-button">Одиночный портрет 3</button></a>
            </div>
        </div>
    </div>
</body>
</html>
